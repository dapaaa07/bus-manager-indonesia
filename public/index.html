    <!-- PERFORMANCE.MEASURE SAFETY GUARD FOR REACT 19 DEV & WEBVIEW -->
    <script>
      (function() {
        if (typeof window !== 'undefined' && window.performance && typeof window.performance.measure === 'function') {
          var _origMeasure = window.performance.measure.bind(window.performance);
          window.performance.measure = function(name, startOrOptions, end) {
            try {
              return _origMeasure(name, startOrOptions, end);
            } catch (err) {
              try {
                // If structuredClone failed with DataCloneError, retry without heavy detail
                if (startOrOptions && typeof startOrOptions === 'object') {
                  return _origMeasure(name, {
                    start: typeof startOrOptions.start === 'number' ? startOrOptions.start : undefined,
                    end: typeof startOrOptions.end === 'number' ? startOrOptions.end : undefined
                  });
                }
                return _origMeasure(name);
              } catch (_) {
                // Prevent any timing failure from throwing or crashing React 19 reconciler
                return undefined;
              }
            }
          };
        }
      })();
    </script>
    <!-- GLOBAL ERROR HANDLER FOR APK DEBUGGING & RESILIENCE -->
    <script>
      window.onerror = function(message, source, lineno, colno, error) {
        var msgStr = String(message || '') + ' ' + String(error && error.message || '');
        if (
          msgStr.includes('FIRESTORE INTERNAL ASSERTION FAILED') ||
          msgStr.includes('prefixPath') ||
          msgStr.includes('IndexedDb') ||
          msgStr.includes('indexedDb') ||
          msgStr.includes('IDBDatabase') ||
          msgStr.includes('send was called before connect') ||
          msgStr.includes('[vite]') ||
          msgStr.includes('WebSocket') ||
          msgStr.includes('DataCloneError') ||
          msgStr.includes('Data cannot be cloned') ||
          msgStr.includes("Failed to execute 'measure' on 'Performance'") ||
          msgStr.includes('Should not already be working')
        ) {
          console.warn("Benign internal warning suppressed:", message, error);
          return true;
        }
        var overlay = document.getElementById('error-overlay');
        if(overlay) {
          overlay.style.display = 'block';
          overlay.innerText += "ERROR: " + message + "\nAT: " + source + ":" + lineno + "\n\n";
          var loader = document.getElementById('loading-screen');
          if(loader) loader.style.display = 'none';
        }
      };
      window.onunhandledrejection = function(event) {
        var reasonStr = String(event && event.reason ? (event.reason.message || event.reason) : '');
        if (
          reasonStr.includes('FIRESTORE INTERNAL ASSERTION FAILED') ||
          reasonStr.includes('prefixPath') ||
          reasonStr.includes('IndexedDb') ||
          reasonStr.includes('indexedDb') ||
          reasonStr.includes('unimplemented') ||
          reasonStr.includes('IDBDatabase') ||
          reasonStr.includes('send was called before connect') ||
          reasonStr.includes('[vite]') ||
          reasonStr.includes('WebSocket') ||
          reasonStr.includes('DataCloneError') ||
          reasonStr.includes('Data cannot be cloned') ||
          reasonStr.includes("Failed to execute 'measure' on 'Performance'") ||
          reasonStr.includes('Should not already be working')
        ) {
          console.warn("Benign rejection suppressed:", event.reason);
          event.preventDefault();
          return;
        }
        var overlay = document.getElementById('error-overlay');
        if(overlay) {
          overlay.style.display = 'block';
          overlay.innerText += "PROMISE REJECTION: " + event.reason + "\n\n";
        }
      };
    </script>
